# Banco PostgreSQL para desenvolvimento local: `npm run db:up`.
# A porta padrão é 5433 para não conflitar com um PostgreSQL já instalado na máquina.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recomenda
      POSTGRES_PASSWORD: recomenda
      POSTGRES_DB: recomenda_filmes
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recomenda -d recomenda_filmes']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
